# code: language=ansible
---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Set dns output dir fact
      ansible.builtin.set_fact:
        dns_output_dir: "{{ (dns_record_output_dir | regex_replace('/+$', '')) }}"
    - name: Stat dns output dir on control node
      ansible.builtin.stat:
        path: "{{ dns_output_dir }}"
      register: dns_output_dir_stat
      delegate_to: localhost
      become: false
    - name: Assert dns output dir exists on control node
      ansible.builtin.assert:
        that:
          - dns_output_dir_stat.stat.exists
          - dns_output_dir_stat.stat.isdir
        fail_msg: "DNS output directory not found on control node: {{ dns_output_dir }}"
        success_msg: "DNS output directory exists on control node: {{ dns_output_dir }}"
    - name: Set expected output files
      ansible.builtin.set_fact:
        dns_expected_files:
          - example.co.jp.csv
          - example.co.jp.md
          - example.com.csv
          - example.com.md
          - example.net.csv
          - example.net.md
          - mail.example.com.csv
          - mail.example.com.md
          - subdomain.example.com.csv
          - subdomain.example.com.md
          - subdomain.example.net.csv
          - subdomain.example.net.md
          - www.example.com.csv
          - www.example.com.md
          - zone_example.co.jp.txt
          - zone_example.com.txt
          - zone_example.net.txt
          - "{{ dns_opendkim_keys_dir }}/example.com_default.private"
          - "{{ dns_opendkim_keys_dir }}/subdomain.example.com_default.private"
          - "{{ dns_opendkim_keys_dir }}/subdomain.example.net_default.private"
    - name: Find output files on control node
      ansible.builtin.find:
        paths: "{{ dns_output_dir }}"
        file_type: file
        recurse: true
      register: dns_output_files
      delegate_to: localhost
      become: false
    - name: Set actual output file list
      ansible.builtin.set_fact:
        dns_actual_files: "{{ dns_output_files.files | map(attribute='path') | map('regex_replace', '^' + dns_output_dir + '/', '') | list | sort }}"
        dns_expected_files_sorted: "{{ dns_expected_files | list | sort }}"
    - name: Assert output files are an exact match
      ansible.builtin.assert:
        that:
          - dns_actual_files == dns_expected_files_sorted
        fail_msg: |-
          Output files mismatch.
          Expected: {{ dns_expected_files_sorted }}
          Actual:   {{ dns_actual_files }}
        success_msg: "Output files match expected list"
    ## OpenDKIM キーファイルの保存確認テスト
    - name: Check if OpenDKIM keys directory exists
      ansible.builtin.stat:
        path: "{{ dns_output_dir }}/{{ dns_opendkim_keys_dir }}"
      register: dns_keys_dir_stat
      delegate_to: localhost
      become: false
    - name: Assert OpenDKIM keys directory exists
      ansible.builtin.assert:
        that:
          - dns_keys_dir_stat.stat.exists
          - dns_keys_dir_stat.stat.isdir
        fail_msg: "OpenDKIM keys directory not found"
        success_msg: "OpenDKIM keys directory exists"
    - name: Verify OpenDKIM key files are readable
      ansible.builtin.stat:
        path: "{{ dns_output_dir }}/{{ dns_opendkim_keys_dir }}/{{ item }}"
      register: dns_key_files_stat
      delegate_to: localhost
      become: false
      loop:
        - "example.com_default.private"
        - "subdomain.example.com_default.private"
        - "subdomain.example.net_default.private"
    - name: Assert all OpenDKIM key files are readable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.readable
        fail_msg: "OpenDKIM key file is missing or not readable: {{ item.invocation.module_args.path }}"
        success_msg: "OpenDKIM key file is accessible: {{ item.invocation.module_args.path }}"
      loop: "{{ dns_key_files_stat.results }}"
      delegate_to: localhost
      become: false
