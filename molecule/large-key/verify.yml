# code: language=ansible
---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    ## 出力ディレクトリのテスト
    - name: Set dns output dir fact
      ansible.builtin.set_fact:
        dns_output_dir: "{{ (dns_record_output_dir | default(dns_recode_output_dir | default('./dns_info'))) | regex_replace('/+$', '') }}"
    - name: Stat dns output dir on control node
      ansible.builtin.stat:
        path: "{{ dns_output_dir }}"
      register: dns_output_dir_stat
      delegate_to: localhost
      become: false
    - name: Assert dns output dir exists on control node
      ansible.builtin.assert:
        that:
          - dns_output_dir_stat.stat.exists
          - dns_output_dir_stat.stat.isdir
        fail_msg: "DNS output directory not found on control node: {{ dns_output_dir }}"
        success_msg: "DNS output directory exists on control node: {{ dns_output_dir }}"
    - name: Set expected output files
      ansible.builtin.set_fact:
        dns_expected_files:
          - example.co.jp.csv
          - example.co.jp.md
          - example.com.csv
          - example.com.md
          - example.net.csv
          - example.net.md
          - mail.example.com.csv
          - mail.example.com.md
          - subdomain.example.com.csv
          - subdomain.example.com.md
          - subdomain.example.net.csv
          - subdomain.example.net.md
          - www.example.com.csv
          - www.example.com.md
          - zone_example.co.jp.txt
          - zone_example.com.txt
          - zone_example.net.txt
    - name: Find output files on control node
      ansible.builtin.find:
        paths: "{{ dns_output_dir }}"
        file_type: file
      register: dns_output_files
      delegate_to: localhost
      become: false
    - name: Set actual output file list
      ansible.builtin.set_fact:
        dns_actual_files: "{{ dns_output_files.files | map(attribute='path') | map('basename') | list | sort }}"
        dns_expected_files_sorted: "{{ dns_expected_files | list | sort }}"
    - name: Assert output files are an exact match
      ansible.builtin.assert:
        that:
          - dns_actual_files == dns_expected_files_sorted
        fail_msg: |-
          Output files mismatch.
          Expected: {{ dns_expected_files_sorted }}
          Actual:   {{ dns_actual_files }}
        success_msg: "Output files match expected list"
    ## DKIM レコード値の一致性テスト
    - name: Read zone file for DKIM records
      ansible.builtin.slurp:
        src: "{{ dns_output_dir }}/zone_example.com.txt"
      register: dns_zone_file
      delegate_to: localhost
      become: false
    - name: Extract DKIM records from zone file
      ansible.builtin.set_fact:
        dns_zone_dkim_records: "{{ (dns_zone_file.content | b64decode) | regex_findall('v=DKIM1[^\"]*') }}"
    - name: Read Markdown file for DKIM records
      ansible.builtin.slurp:
        src: "{{ dns_output_dir }}/example.com.md"
      register: dns_md_file
      delegate_to: localhost
      become: false
    - name: Extract DKIM records from Markdown
      ansible.builtin.set_fact:
        dns_md_dkim_records: "{{ (dns_md_file.content | b64decode) | regex_findall('v=DKIM1[^`]*') }}"
    - name: Read CSV file for DKIM records
      ansible.builtin.slurp:
        src: "{{ dns_output_dir }}/example.com.csv"
      register: dns_csv_file
      delegate_to: localhost
      become: false
    - name: Extract DKIM records from CSV
      ansible.builtin.set_fact:
        dns_csv_dkim_records: "{{ (dns_csv_file.content | b64decode) | regex_findall('v=DKIM1[^\"]*') }}"
    - name: Validate DKIM records exist in all formats
      ansible.builtin.assert:
        that:
          - dns_zone_dkim_records | length > 0
          - dns_md_dkim_records | length > 0
          - dns_csv_dkim_records | length > 0
        fail_msg: "DKIM records not found in one or more formats (zone, markdown, csv)"
        success_msg: "DKIM records found and validated in all formats"
      delegate_to: localhost
      become: false
