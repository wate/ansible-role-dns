    #   delegate_to: localhost
    #   become: false
    # - name: Assert DKIM record is split in zone file(example.com)
    #   ansible.builtin.assert:
    #     that:
    #       - dkim_block | length > 0
    #       - dkim_block is regex_search('[\t ]TXT[\t ]+\(')
    #       - dkim_quoted_line_count | int >= 2
    #     fail_msg: "DKIM record is not split as expected in zone file: {{ zone_example_com_file }}"
    #     success_msg: "DKIM record is split as expected in zone file: {{ zone_example_com_file }}"
    #   when: false
