---
- name: Initialize zone TXT record variable
  ansible.builtin.set_fact:
    dns_zones: "{{ dns_zones | combine({dns_zone: {'TXT': []}}, recursive=true) }}"
  when: dns_zones[dns_zone]['TXT'] is undefined
- name: Set record value variables
  ansible.builtin.set_fact:
    dns_record_value: "{{ dns_domain_setting.site_verification }}"
- name: Combine Site verification record
  ansible.builtin.set_fact:
    dns_domain_records: "{{ dns_domain_records | combine({'Site verification': dns_record}, recursive=true) }}"
  vars:
    dns_record:
      name: "{{ dns_record_name }}"
      type: TXT
      value: "{{ dns_record_value }}"
      ttl: "{{ dns_ttl_default }}"
- name: Append zone Site verification record variable
  ansible.builtin.set_fact:
    dns_zones: "{{ dns_zones | combine({dns_zone: {'TXT': [dns_zone_data]}}, recursive=true, list_merge='append') }}"
  vars:
    dns_zone_data:
      name: "{{ (dns_record_name == '@') | ternary('', dns_record_name + '.') }}{{ dns_zone }}."
      ttl: "{{ dns_ttl_default }}"
      type: TXT
      value: "{{ dns_record_value }}"
      comment: Site verification Record
